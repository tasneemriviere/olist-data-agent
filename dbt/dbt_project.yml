name: olist
version: "1.0.0"
config-version: 2

profile: olist

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

clean-targets:
  - target
  - dbt_packages

models:
  olist:
    # Copie les descriptions dbt en commentaires Snowflake (tables et colonnes) :
    # l'agent IA peut ainsi lire la documentation directement depuis INFORMATION_SCHEMA.
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: STAGING
      +materialized: view
    marts:
      +schema: MARTS
      +materialized: table

seeds:
  olist:
    +schema: STAGING
